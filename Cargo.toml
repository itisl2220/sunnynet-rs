[package]
name = "sunnynet-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust FFI wrapper for SunnyNet DLL with dynamic symbol loading."
license = "MIT"
repository = "https://github.com/itisl2220/sunnynet-rs"
homepage = "https://github.com/itisl2220/sunnynet-rs"
documentation = "https://docs.rs/sunnynet-sdk"
readme = "README.md"
keywords = ["ffi", "dll", "proxy", "windows", "sunnynet"]
categories = ["api-bindings", "network-programming"]
exclude = [
    "bin/*.dll",
    "*.tmp",
    "target/*",
]

[dependencies]
libloading = "0.8"
